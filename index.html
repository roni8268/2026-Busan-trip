<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>釜山 BUSAN｜9/10–9/18 情侶行程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0E2A47;
    --navy-deep:#081b30;
    --coral:#FF6B4E;
    --sand:#F6EEE2;
    --teal:#1F7A72;
    --gold:#E8B04B;
    --ink:#122436;
    --paper:#FBF7F0;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--sand);
    color:var(--ink);
    font-family:'Noto Sans TC',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .serif{font-family:'Noto Serif TC',serif;}
  .num{font-family:'Bebas Neue',sans-serif; letter-spacing:0.04em;}

  /* ---------- HERO / BOARDING PASS ---------- */
  .hero{
    background:
      radial-gradient(circle at 15% 20%, rgba(255,107,78,0.25), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(31,122,114,0.35), transparent 45%),
      linear-gradient(160deg,var(--navy-deep),var(--navy) 60%);
    padding:56px 20px 80px;
    position:relative;
    overflow:hidden;
  }
  .hero:before{
    content:"";
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(transparent, transparent 38px, rgba(255,255,255,0.035) 39px);
    pointer-events:none;
  }
  .hero-inner{max-width:920px; margin:0 auto; position:relative; z-index:2;}
  .eyebrow{
    color:var(--gold); text-transform:uppercase; letter-spacing:0.35em;
    font-size:12px; font-weight:700; margin-bottom:16px;
  }
  .hero h1{
    font-size:clamp(48px,10vw,104px);
    line-height:0.9;
    margin:0;
    color:var(--paper);
    font-weight:900;
  }
  .hero h1 span{color:var(--coral); font-style:italic; font-family:'Noto Serif TC',serif; font-weight:700; font-size:0.55em; display:block; margin-top:6px;}

  .ticket{
    margin-top:40px;
    background:var(--paper);
    border-radius:18px;
    display:flex;
    box-shadow:0 30px 60px rgba(0,0,0,0.35);
    position:relative;
    overflow:hidden;
  }
  .ticket-main{flex:1; padding:24px 28px; display:flex; gap:26px; flex-wrap:wrap;}
  .ticket-stub{
    width:200px; padding:24px 18px; background:var(--navy);
    color:var(--paper); position:relative;
    border-left:2px dashed rgba(255,255,255,0.25);
    display:flex; flex-direction:column; justify-content:center;
  }
  .tk-label{font-size:10px; letter-spacing:0.15em; text-transform:uppercase; color:#9fb3c8; margin-bottom:4px;}
  .tk-value{font-size:14px; font-weight:700; margin-bottom:12px;}
  .route{display:flex; align-items:center; gap:12px;}
  .route .city{font-family:'Bebas Neue'; font-size:30px; letter-spacing:0.05em;}
  .route .plane{color:var(--coral); font-size:18px;}
  .flight-num{font-family:'Bebas Neue'; font-size:18px; color:var(--gold); letter-spacing:0.08em;}

  /* lodging strip */
  .lodging{
    max-width:920px; margin:26px auto 0; display:flex; gap:14px; flex-wrap:wrap;
    position:relative; z-index:2;
  }
  .lodge-card{
    flex:1; min-width:220px; background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.15); border-radius:14px; padding:16px 18px;
    color:var(--paper);
  }
  .lodge-card .lg-label{color:var(--gold); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:4px;}
  .lodge-card .lg-area{font-family:'Bebas Neue'; font-size:24px; letter-spacing:0.03em;}
  .lodge-card .lg-date{font-size:12px; color:#c3d1de; margin-top:2px;}

  /* ---------- NAV ---------- */
  .daynav{
    position:sticky; top:0; z-index:50;
    background:rgba(251,247,240,0.94);
    backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(14,42,71,0.12);
    display:flex; gap:6px; overflow-x:auto;
    padding:12px 16px;
    scrollbar-width:none;
  }
  .daynav::-webkit-scrollbar{display:none;}
  .daynav button{
    flex:0 0 auto;
    border:1px solid rgba(14,42,71,0.18);
    background:transparent;
    color:var(--navy);
    padding:8px 16px;
    border-radius:999px;
    font-family:'Noto Sans TC'; font-weight:700; font-size:13px;
    cursor:pointer;
    transition:all .2s ease;
    white-space:nowrap;
  }
  .daynav button .d{font-family:'Bebas Neue'; font-size:15px; margin-right:4px; color:var(--coral);}
  .daynav button.active{background:var(--navy); color:var(--paper); border-color:var(--navy);}
  .daynav button.active .d{color:var(--gold);}
  .daynav button.vbp-btn{border-color:var(--gold); color:#9a7418;}
  .daynav button.vbp-btn.active{background:var(--gold); color:var(--navy-deep);}
  .daynav button.shop-btn{border-color:var(--teal); color:var(--teal);}
  .daynav button.shop-btn.active{background:var(--teal); color:#fff;}
  .daynav button.notes-btn{border-color:#8a5cf6; color:#6a3fd1;}
  .daynav button.notes-btn.active{background:#8a5cf6; color:#fff;}

  /* ---------- DAY SECTIONS ---------- */
  main{max-width:820px; margin:0 auto; padding:50px 20px 40px;}
  .day{ display:none; animation:fade .4s ease; }
  .day.active{display:block;}
  @keyframes fade{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

  .day-head{display:flex; align-items:flex-end; gap:16px; margin-bottom:6px;}
  .day-head .big{font-family:'Bebas Neue'; font-size:80px; line-height:0.8; color:var(--navy);}
  .day-head .meta{padding-bottom:6px;}
  .day-head .meta .date{color:var(--coral); font-weight:700; font-size:13px; letter-spacing:0.1em;}
  .day-head .meta h2{margin:2px 0 0; font-size:25px; font-family:'Noto Serif TC'; font-weight:700; color:var(--ink); outline:none;}
  .lodge-pill{
    display:inline-flex; align-items:center; gap:6px; margin:14px 0 30px;
    background:#fff; border:1px solid rgba(14,42,71,0.12); border-radius:999px;
    padding:6px 14px; font-size:12px; color:#5a6b7a; font-weight:700;
  }
  .lodge-pill .dot{width:7px; height:7px; border-radius:50%; background:var(--teal);}

  .timeline{position:relative; margin-left:6px; padding-left:26px; border-left:2px dashed rgba(14,42,71,0.25);}
  .item{position:relative; padding-bottom:28px;}
  .item:last-child{padding-bottom:4px;}
  .item:before{
    content:""; position:absolute; left:-33px; top:4px;
    width:14px; height:14px; border-radius:50%;
    background:var(--paper); border:3px solid var(--coral);
  }
  .item.food:before{border-color:var(--gold);}
  .item.view:before{border-color:var(--teal);}
  .item.pass:before{border-color:#8a5cf6;}
  .time-row{display:flex; align-items:center; gap:0;}
  .time-text{font-family:'Bebas Neue'; color:var(--navy); font-size:18px; letter-spacing:0.05em; outline:none;}
  .tag{
    display:inline-block; font-size:10px; font-weight:700; letter-spacing:0.08em;
    padding:2px 8px; border-radius:20px; margin-left:8px; vertical-align:2px;
    background:rgba(31,122,114,0.12); color:var(--teal);
  }
  .item.food .tag{background:rgba(232,176,75,0.18); color:#9a7418;}
  .item.view .tag{background:rgba(255,107,78,0.15); color:#c9502f;}
  .item.pass .tag{background:rgba(138,92,246,0.15); color:#6a3fd1;}
  .item h3{margin:6px 0 4px; font-size:17px; font-weight:700; color:var(--ink); outline:none;}
  .item p{margin:0; font-size:14px; line-height:1.7; color:#4b5b6a; outline:none;}

  .tipbox{
    margin-top:34px; background:#fff; border:1px solid rgba(14,42,71,0.1);
    border-radius:14px; padding:16px 20px; font-size:13.5px; color:#4b5b6a; line-height:1.8; outline:none;
  }
  .tipbox b{color:var(--navy);}
  .tipbox.rain{border-left:3px solid var(--teal);}
  .tipbox.trap{border-left:3px solid var(--coral); margin-top:14px;}

  /* VBP panel */
  .vbp-panel{display:none;}
  .vbp-panel.active{display:block; animation:fade .4s ease;}
  .vbp-hero{
    background:linear-gradient(135deg, rgba(232,176,75,0.15), rgba(138,92,246,0.08));
    border:1px solid rgba(232,176,75,0.35); border-radius:16px; padding:22px 24px; margin-bottom:24px;
  }
  .vbp-hero h2{margin:0 0 8px; font-family:'Noto Serif TC'; font-size:22px; color:var(--ink);}
  table.vbp-table{width:100%; border-collapse:collapse; margin:18px 0; font-size:13.5px;}
  table.vbp-table th, table.vbp-table td{text-align:left; padding:9px 10px; border-bottom:1px solid rgba(14,42,71,0.1);}
  table.vbp-table th{color:var(--navy); font-size:11px; text-transform:uppercase; letter-spacing:0.06em;}
  .badge-purple{display:inline-block; width:10px; height:10px; border-radius:50%; background:#8a5cf6; margin-right:6px;}

  footer{text-align:center; padding:50px 20px 70px; color:#8093a8; font-size:12px; letter-spacing:0.05em;}
  footer .wave{font-family:'Bebas Neue'; font-size:13px; color:var(--coral); margin-bottom:8px; letter-spacing:0.3em;}

  /* ---------- EDIT MODE ---------- */
  .edit-fab{
    position:fixed; right:20px; bottom:20px; z-index:100;
    display:flex; flex-direction:column; gap:10px; align-items:flex-end;
  }
  .edit-fab button{
    border:none; border-radius:999px; padding:12px 20px; font-family:'Noto Sans TC'; font-weight:700;
    font-size:13px; cursor:pointer; box-shadow:0 10px 24px rgba(0,0,0,0.2); display:flex; align-items:center; gap:6px;
  }
  #toggleEdit{background:var(--navy); color:var(--paper);}
  #toggleEdit.on{background:var(--coral);}
  #saveEdit, #resetEdit{display:none; background:#fff; color:var(--navy); border:1px solid rgba(14,42,71,0.2) !important;}
  .edit-fab.editing #saveEdit, .edit-fab.editing #resetEdit{display:flex;}
  body.editing .editable{outline:1.5px dashed rgba(255,107,78,0.55); outline-offset:3px; border-radius:4px; cursor:text;}
  body.editing .editable:hover{background:rgba(255,107,78,0.06);}
  body.editing .editable:focus{outline:1.5px solid var(--coral); background:rgba(255,107,78,0.08);}
  .toast{
    position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px);
    background:var(--navy); color:var(--paper); padding:10px 20px; border-radius:999px;
    font-size:13px; font-weight:700; opacity:0; pointer-events:none; transition:all .3s ease; z-index:200;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* 密碼鎖 */
  #lockOverlay{
    position:fixed; inset:0; background:rgba(8,27,48,0.92); z-index:300;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  #lockOverlay.hidden{display:none;}
  .lock-box{
    background:var(--paper); border-radius:16px; padding:28px 26px; width:100%; max-width:320px;
    text-align:center; box-shadow:0 20px 50px rgba(0,0,0,0.4);
  }
  .lock-box h3{margin:0 0 6px; font-family:'Noto Serif TC'; color:var(--ink);}
  .lock-box p{margin:0 0 16px; font-size:12.5px; color:#5a6b7a;}
  .lock-box input{
    width:100%; padding:10px 12px; border:1px solid rgba(14,42,71,0.2); border-radius:8px;
    font-size:15px; text-align:center; letter-spacing:0.1em; margin-bottom:12px;
  }
  .lock-box button{
    width:100%; padding:10px; border:none; border-radius:8px; background:var(--coral); color:#fff;
    font-weight:700; font-size:14px; cursor:pointer;
  }
  .lock-box .err{color:var(--coral); font-size:12px; height:16px; margin-top:8px;}

  /* 編輯模式下才顯示的結構控制項（排序／分類／新增／刪除） */
  .edit-ctrl{display:none;}
  body.editing .edit-ctrl{display:inline-flex;}
  .item-ctrl{
    display:none; gap:6px; align-items:center; margin-bottom:8px; flex-wrap:wrap;
  }
  body.editing .item-ctrl{display:flex;}
  .item-ctrl select, .item-ctrl button{
    font-size:12px; padding:3px 8px; border-radius:6px;
    border:1px solid rgba(14,42,71,0.2); background:#fff; color:var(--navy);
    cursor:pointer; font-family:'Noto Sans TC';
  }
  .item-ctrl button:hover{background:rgba(14,42,71,0.06);}
  .item-ctrl button.danger{border-color:rgba(255,107,78,0.4); color:var(--coral);}
  .item-ctrl button.danger:hover{background:rgba(255,107,78,0.08);}
  .day-ctrl{
    display:none; gap:8px; margin-left:auto; padding-bottom:8px;
  }
  body.editing .day-ctrl{display:flex;}
  .day-ctrl button{
    font-size:12px; padding:5px 12px; border-radius:999px;
    border:1px solid rgba(14,42,71,0.2); background:#fff; color:var(--navy);
    cursor:pointer; font-weight:700; font-family:'Noto Sans TC';
  }
  .day-ctrl button:hover{background:rgba(14,42,71,0.06);}
  .day-head{flex-wrap:wrap;}
  .add-day-item{
    display:none; margin-top:10px; padding:10px 16px; border-radius:10px;
    border:1.5px dashed rgba(14,42,71,0.3); background:transparent; color:var(--navy);
    font-weight:700; font-size:13px; cursor:pointer; width:100%; font-family:'Noto Sans TC';
  }
  body.editing .add-day-item{display:block;}
  .add-day-item:hover{background:rgba(14,42,71,0.05);}

  /* 交通方式列 */
  .transport-row{
    display:none; align-items:center; gap:6px; font-size:12.5px;
    color:#5a7382; margin:2px 0 8px;
  }
  .transport-row:not(.is-empty){display:flex;}
  .transport-icon{font-size:13px;}
  .transport-text{outline:none;}
  .transport-text:empty:before{content:attr(data-placeholder); color:#aab8c2; font-style:italic;}
  body.editing .transport-row{display:flex;}

  /* 購物清單 */
  .shop-panel{display:none;}
  .shop-panel.active{display:block; animation:fade .4s ease;}
  .shop-list{background:#fff; border:1px solid rgba(14,42,71,0.1); border-radius:14px; overflow:hidden;}
  .shop-item{
    display:flex; align-items:center; gap:12px; padding:13px 18px;
    border-bottom:1px solid rgba(14,42,71,0.08);
  }
  .shop-item:last-child{border-bottom:none;}
  .shop-item input[type=checkbox]{width:18px; height:18px; accent-color:var(--teal); cursor:pointer; flex:0 0 auto;}
  .shop-item .shop-text{flex:1; font-size:14.5px; outline:none; border-radius:4px; padding:2px 4px;}
  .shop-item .shop-text:hover{background:rgba(31,122,114,0.06);}
  .shop-item .shop-text:focus{outline:1.5px solid var(--teal); background:rgba(31,122,114,0.08);}
  .shop-item.done .shop-text{text-decoration:line-through; color:#9aa9b6;}
  .shop-item button.danger{
    flex:0 0 auto; font-size:12px; padding:3px 8px; border-radius:6px;
    border:1px solid rgba(255,107,78,0.4); color:var(--coral); background:#fff; cursor:pointer;
  }
  .shop-add-btn{
    margin-top:10px; padding:10px 16px; border-radius:10px;
    border:1.5px dashed rgba(31,122,114,0.4); background:transparent; color:var(--teal);
    font-weight:700; font-size:13px; cursor:pointer; width:100%; font-family:'Noto Sans TC';
  }
  .shop-add-btn:hover{background:rgba(31,122,114,0.06);}

  /* 筆記本 */
  .notes-panel{display:none;}
  .notes-panel.active{display:block; animation:fade .4s ease;}
  .notes-box{
    background:#fff; border:1px solid rgba(14,42,71,0.1); border-radius:14px;
    padding:22px 24px; min-height:340px; font-size:14.5px; line-height:1.9;
    color:var(--ink); outline:none; white-space:pre-wrap; word-break:break-word;
  }
  .notes-box:focus{outline:1.5px solid #8a5cf6; background:rgba(138,92,246,0.03);}
  .notes-box:empty:before{content:attr(data-placeholder); color:#aab8c2; font-style:italic;}

  @media(max-width:640px){
    .ticket{flex-direction:column;}
    .ticket-stub{border-left:none; border-top:2px dashed rgba(255,255,255,0.25);}
    .day-head .big{font-size:60px;}
    .edit-fab{right:14px; bottom:14px;}
  }
</style>
</head>
<body>

<section class="hero">
  <div class="hero-inner">
    <div class="eyebrow">Couple Trip · 9 Days 8 Nights</div>
    <h1>BUSAN<span>釜山慢旅</span></h1>

    <div class="ticket">
      <div class="ticket-main">
        <div>
          <div class="tk-label">Departure</div>
          <div class="route"><span class="plane">✈</span><span class="city">TPE</span></div>
          <div class="tk-value">2026.09.10　12:00</div>
        </div>
        <div>
          <div class="tk-label">Arrival</div>
          <div class="route"><span class="city">PUS</span></div>
          <div class="tk-value">2026.09.10　15:30</div>
        </div>
        <div>
          <div class="tk-label">Flight</div>
          <div class="flight-num">KE2086</div>
          <div class="tk-value" style="margin-top:2px;">大韓航空</div>
        </div>
      </div>
      <div class="ticket-stub">
        <div class="tk-label">Return</div>
        <div class="tk-value">09.18　PUS→TPE</div>
        <div class="tk-label">09:00 — 10:30</div>
        <div class="tk-value" style="margin-bottom:0;">KE2085</div>
      </div>
    </div>
  </div>

  <div class="lodging">
    <div class="lodge-card">
      <div class="lg-label">住宿 1</div>
      <div class="lg-area">廣安里</div>
      <div class="lg-date">9/10 – 9/14（4晚）</div>
    </div>
    <div class="lodge-card">
      <div class="lg-label">住宿 2</div>
      <div class="lg-area">南浦洞</div>
      <div class="lg-date">9/14 – 9/18（4晚）</div>
    </div>
  </div>
</section>

<nav class="daynav" id="daynav"></nav>

<main id="days"></main>

<footer>
  <div class="wave">〜 SEE YOU IN BUSAN 〜</div>
  釜山行程 · 2026.09.10 – 09.18
</footer>

<div class="edit-fab" id="editFab">
  <button id="saveEdit">💾 儲存變更</button>
  <button id="resetEdit">↺ 還原預設</button>
  <button id="toggleEdit">✏️ 編輯文字</button>
</div>
<div class="toast" id="toast"></div>

<!-- 編輯密碼鎖：只有你知道密碼才能進入編輯模式 -->
<div id="lockOverlay" class="hidden">
  <div class="lock-box">
    <h3>🔒 編輯權限</h3>
    <p>請輸入編輯密碼才能修改行程內容</p>
    <input type="password" id="lockInput" placeholder="密碼">
    <button id="lockSubmit">解鎖</button>
    <div class="err" id="lockErr"></div>
  </div>
</div>

<script type="module">

let DAYS = [];
let VBP = null;
let SHOPPING = [];
let NOTES = '';

const SHOPPING_DEFAULT = [
  {name:"面膜", done:false},
  {name:"泡菜／調味料", done:false},
  {name:"燒酒／韓國啤酒", done:false},
  {name:"零食（辣雞腳、蝦餅）", done:false},
];

/* 確保每個行程項目都有 tr（交通方式）欄位，避免舊資料缺欄位報錯 */
function normalizeItem(it){
  return { t: it.t||'', c: it.c||'', h: it.h||'', p: it.p||'', tr: it.tr||'' };
}
/* 清掉舊版 bug 造成「日期 · 標籤 · 標籤 · 標籤」重複黏在一起的資料，只保留第一段日期＋第一個標籤 */
function normalizeDay(d){
  const raw = (d.date || '').trim();
  const parts = raw.split('·').map(s=>s.trim()).filter(Boolean);
  const cleanDate = parts.length ? parts[0] : raw;
  const cleanTag = (d.tag && d.tag.trim()) ? d.tag.trim() : (parts.length > 1 ? parts[1] : '');
  return { ...d, date: cleanDate, tag: cleanTag, items: (d.items||[]).map(normalizeItem) };
}
function normalizeDays(days){
  return days.map(normalizeDay);
}

/* ============ 儲存 / 讀取（Firebase Realtime Database） ============ */
async function loadData(){
  let daysNeedRepair = false;
  try{
    const snap = await get(ref(db, 'busan-days'));
    const raw = snap.exists() ? snap.val() : JSON.parse(JSON.stringify(DEFAULT_DAYS));
    DAYS = normalizeDays(raw);
    // 如果清理前後不一樣，代表資料庫裡還存著舊版重複的日期文字，稍後自動存回乾淨版本
    if(snap.exists() && JSON.stringify(raw) !== JSON.stringify(DAYS)) daysNeedRepair = true;
  }catch(e){ console.error('讀取 busan-days 失敗:', e); DAYS = normalizeDays(JSON.parse(JSON.stringify(DEFAULT_DAYS))); }
  try{
    const snapVbp = await get(ref(db, 'busan-vbp'));
    VBP = snapVbp.exists() ? snapVbp.val() : JSON.parse(JSON.stringify(VBP_DEFAULT));
  }catch(e){ console.error('讀取 busan-vbp 失敗:', e); VBP = JSON.parse(JSON.stringify(VBP_DEFAULT)); }
  try{
    const snapShop = await get(ref(db, 'busan-shopping'));
    SHOPPING = snapShop.exists() ? snapShop.val() : JSON.parse(JSON.stringify(SHOPPING_DEFAULT));
  }catch(e){ console.error('讀取 busan-shopping 失敗:', e); SHOPPING = JSON.parse(JSON.stringify(SHOPPING_DEFAULT)); }
  try{
    const snapNotes = await get(ref(db, 'busan-notes'));
    NOTES = snapNotes.exists() ? snapNotes.val() : '';
  }catch(e){ console.error('讀取 busan-notes 失敗:', e); NOTES = ''; }

  if(daysNeedRepair){
    try{
      await set(ref(db, 'busan-days'), DAYS);
      console.log('已自動修復日期重複的舊資料');
    }catch(e){ console.error('自動修復失敗:', e); }
  }
}

async function saveData(){
  await set(ref(db, 'busan-days'), DAYS);
  await set(ref(db, 'busan-vbp'), VBP);
  await set(ref(db, 'busan-shopping'), SHOPPING);
  await set(ref(db, 'busan-notes'), NOTES);
}

function scrapeDaysFromDom(){
  const out = [];
  document.querySelectorAll('.day').forEach((sec, idx)=>{
    const base = DAYS[idx];
    const items = [];
    sec.querySelectorAll('.item').forEach((it)=>{
      const sel = it.querySelector('.cat-select');
      const trEl = it.querySelector('.transport-text');
      items.push({
        t: it.querySelector('.time-text').innerText.trim(),
        c: sel ? sel.value : "",
        h: it.querySelector('h3').innerText.trim(),
        p: it.querySelector('p').innerText.trim(),
        tr: trEl ? trEl.innerText.trim() : "",
      });
    });
    const tipEl = sec.querySelector('.tipbox.main-tip');
    const rainEl = sec.querySelector('.tipbox.rain');
    const trapEl = sec.querySelector('.tipbox.trap');
    out.push({
      date: sec.querySelector('.date-text').innerText.trim(),
      title: sec.querySelector('h2').innerText.trim(),
      tag: sec.querySelector('.tag-text').innerText.trim(),
      lodge: base.lodge,
      items,
      tip: tipEl ? tipEl.innerText.replace('Tip：','').trim() : null,
      rain: rainEl ? rainEl.innerText.replace('雨備：','').trim() : null,
      trap: trapEl ? trapEl.innerText.replace('避開陷阱：','').trim() : null,
    });
  });
  return out;
}

function scrapeShopFromDom(){
  const rows = document.querySelectorAll('.shop-item');
  const out = [];
  rows.forEach(row=>{
    const textEl = row.querySelector('.shop-text');
    const cb = row.querySelector('input[type=checkbox]');
    out.push({ name: textEl ? textEl.innerText.trim() : '', done: cb ? cb.checked : false });
  });
  return out;
}

function scrapeVbpFromDom(){
  const panel = document.getElementById('vbpPanel');
  if(!panel) return VBP;
  return {
    intro: panel.querySelector('.vbp-intro').innerText.trim(),
    activation: panel.querySelector('.vbp-activation').innerText.trim(),
    rows: Array.from(panel.querySelectorAll('table.vbp-table tbody tr')).map((tr,i)=>{
      const tds = tr.querySelectorAll('td');
      return [tds[1].innerText.trim(), tds[2].innerText.trim(), tds[3].innerText.trim(), VBP.rows[i][3]];
    }),
    note: panel.querySelector('.vbp-note').innerText.trim(),
  };
}

  const wrap = document.getElementById('days');

  DAYS.forEach((d,i)=>{
    const btn = document.createElement('button');
    btn.innerHTML = `<span class="d">D${i+1}</span>${d.title}`;
    btn.onclick = ()=>show(i);

    const sec = document.createElement('section');
    sec.className='day';
    sec.id='day-'+i;
    sec.innerHTML = `
      <div class="day-head">
        <div class="big num">${String(i+1).padStart(2,'0')}</div>
        <div class="meta">
          <div class="date"><span class="date-text editable" contenteditable="false">${d.date}</span> · <span class="tag-text editable" contenteditable="false">${d.tag}</span></div>
          <h2 class="serif editable" contenteditable="false">${d.title}</h2>
        </div>
        <div class="day-ctrl">
          <button onclick="window.moveDay(${i},-1)">↑ 提前一天</button>
          <button onclick="window.moveDay(${i},1)">↓ 延後一天</button>
        </div>
      </div>
      <div class="lodge-pill"><span class="dot"></span>${d.lodge||''}</div>
      <div class="timeline">
        ${d.items.map((it,idx)=>`
          <div class="item ${it.c}">
            <div class="item-ctrl">
              <select class="cat-select" onchange="window.changeCategory(${i},${idx},this.value)">
                <option value=""${it.c===''?' selected':''}>無標籤</option>
                <option value="food"${it.c==='food'?' selected':''}>🍜 吃</option>
                <option value="view"${it.c==='view'?' selected':''}>🌅 景</option>
                <option value="pass"${it.c==='pass'?' selected':''}>🎫 PASS</option>
              </select>
              <button onclick="window.moveItem(${i},${idx},-1)" title="上移">↑ 上移</button>
              <button onclick="window.moveItem(${i},${idx},1)" title="下移">↓ 下移</button>
              <button onclick="window.addItem(${i},${idx})" title="在下方新增一項">＋ 新增</button>
              <button class="danger" onclick="window.deleteItem(${i},${idx})" title="刪除此項">✕ 刪除</button>
            </div>
            <div class="time-row"><span class="time-text editable" contenteditable="false">${it.t}</span>${it.c==='food'?'<span class="tag">吃</span>':it.c==='view'?'<span class="tag">景</span>':it.c==='pass'?'<span class="tag">PASS</span>':''}</div>
            <div class="transport-row${it.tr?'':' is-empty'}">
              <span class="transport-icon">🚕</span>
              <span class="transport-text editable" contenteditable="false" data-placeholder="點此新增交通方式與時間，例如：計程車・約15分鐘">${it.tr||''}</span>
            </div>
            <h3 class="editable" contenteditable="false">${it.h}</h3>
            <p class="editable" contenteditable="false">${it.p}</p>
          </div>`).join('')}
      </div>
      <button class="add-day-item" onclick="window.addItem(${i},${d.items.length-1})">＋ 在本日最後新增一項行程</button>
      ${d.tip?`<div class="tipbox main-tip editable" contenteditable="false"><b>Tip：</b>${d.tip}</div>`:''}
      ${d.rain?`<div class="tipbox rain editable" contenteditable="false"><b>雨備：</b>${d.rain}</div>`:''}
      ${d.trap?`<div class="tipbox trap editable" contenteditable="false"><b>避開陷阱：</b>${d.trap}</div>`:''}
    `;
    wrap.appendChild(sec);
  });

  // VBP nav button
  const vbpBtn = document.createElement('button');
  vbpBtn.className = 'vbp-btn';
  vbpBtn.innerHTML = `<span class="d">🎫</span>VBP攻略`;
  vbpBtn.onclick = ()=>showVbp();
  nav.appendChild(vbpBtn);

  // 購物清單 nav button
  const shopBtn = document.createElement('button');
  shopBtn.className = 'shop-btn';
  shopBtn.innerHTML = `<span class="d">🛍</span>購物清單`;
  shopBtn.onclick = ()=>showShop();
  nav.appendChild(shopBtn);

  // 筆記本 nav button
  const notesBtn = document.createElement('button');
  notesBtn.className = 'notes-btn';
  notesBtn.innerHTML = `<span class="d">📓</span>筆記本`;
  notesBtn.onclick = ()=>showNotes();
  nav.appendChild(notesBtn);

  // VBP panel
  const panel = document.createElement('div');
  panel.className = 'vbp-panel';
  panel.id = 'vbpPanel';
  panel.innerHTML = `
    <div class="vbp-hero">
      <h2 class="serif">Visit Busan Pass 使用計畫</h2>
      <p class="vbp-intro editable" contenteditable="false">${VBP.intro}</p>
    </div>
    <table class="vbp-table">
      <thead><tr><th></th><th>景點</th><th>天</th><th>原價</th></tr></thead>
      <tbody>
        ${VBP.rows.map(r=>`<tr><td><span class="badge-purple" style="background:${r[3]==='紫'?'#8a5cf6':'#1F7A72'}"></span></td><td class="editable" contenteditable="false">${r[0]}</td><td class="editable" contenteditable="false">${r[1]}</td><td class="editable" contenteditable="false">${r[2]}</td></tr>`).join('')}
      </tbody>
    </table>
    <div class="tipbox editable" contenteditable="false" style="border-left:3px solid var(--gold);"><b>開卡技巧：</b><span class="vbp-activation">${VBP.activation}</span></div>
    <div class="tipbox vbp-note editable" contenteditable="false" style="margin-top:14px;">${VBP.note}</div>
  `;
  wrap.appendChild(panel);

  // 購物清單 panel
  const shopPanel = document.createElement('div');
  shopPanel.className = 'shop-panel';
  shopPanel.id = 'shopPanel';
  wrap.appendChild(shopPanel);
  renderShopPanel();

  // 筆記本 panel
  const notesPanel = document.createElement('div');
  notesPanel.className = 'notes-panel';
  notesPanel.id = 'notesPanel';
  wrap.appendChild(notesPanel);
  renderNotesPanel();

  show(0);
}

function renderShopPanel(){
  const shopPanel = document.getElementById('shopPanel');
  if(!shopPanel) return;
  shopPanel.innerHTML = `
    <div class="vbp-hero">
      <h2 class="serif">購物清單</h2>
      <p style="margin:0; font-size:13.5px; color:#5a6b7a;">這裡不用密碼，勾選、新增、刪除、改名稱任何人都能直接操作，會即時同步。</p>
    </div>
    <div class="shop-list">
      ${SHOPPING.map((s,i)=>`
        <div class="shop-item ${s.done?'done':''}">
          <input type="checkbox" ${s.done?'checked':''} onchange="window.toggleShopItem(${i}, this.checked)">
          <span class="shop-text" contenteditable="true">${s.name}</span>
          <button class="danger" onclick="window.deleteShopItem(${i})" title="刪除">✕</button>
        </div>`).join('')}
    </div>
    <button class="shop-add-btn" onclick="window.addShopItem()">＋ 新增購物項目</button>
  `;
}

function renderNotesPanel(){
  const notesPanel = document.getElementById('notesPanel');
  if(!notesPanel) return;
  notesPanel.innerHTML = `
    <div class="vbp-hero">
      <h2 class="serif">筆記本</h2>
      <p style="margin:0; font-size:13.5px; color:#5a6b7a;">自由記事的空白頁，不用密碼，直接點下面打字，游標移開會自動存檔。可以記航班備用碼、訂房編號、臨時想到的事情等等。</p>
    </div>
    <div class="notes-box" id="notesBox" contenteditable="true" data-placeholder="點這裡開始寫筆記...">${NOTES || ''}</div>
  `;
}

function show(i){
  document.querySelectorAll('.day').forEach((el,idx)=>el.classList.toggle('active', idx===i));
  document.getElementById('vbpPanel').classList.remove('active');
  document.getElementById('shopPanel').classList.remove('active');
  document.getElementById('notesPanel').classList.remove('active');
  document.querySelectorAll('.daynav button').forEach((el,idx)=>el.classList.toggle('active', idx===i));
  window.scrollTo({top: document.querySelector('.daynav').offsetTop, behavior:'smooth'});
}
function showVbp(){
  document.querySelectorAll('.day').forEach(el=>el.classList.remove('active'));
  document.getElementById('vbpPanel').classList.add('active');
  document.getElementById('shopPanel').classList.remove('active');
  document.getElementById('notesPanel').classList.remove('active');
  document.querySelectorAll('.daynav button').forEach(el=>el.classList.remove('active'));
  document.querySelector('.daynav button.vbp-btn').classList.add('active');
  window.scrollTo({top: document.querySelector('.daynav').offsetTop, behavior:'smooth'});
}
function showShop(){
  document.querySelectorAll('.day').forEach(el=>el.classList.remove('active'));
  document.getElementById('vbpPanel').classList.remove('active');
  document.getElementById('shopPanel').classList.add('active');
  document.getElementById('notesPanel').classList.remove('active');
  document.querySelectorAll('.daynav button').forEach(el=>el.classList.remove('active'));
  document.querySelector('.daynav button.shop-btn').classList.add('active');
  window.scrollTo({top: document.querySelector('.daynav').offsetTop, behavior:'smooth'});
}
function showNotes(){
  document.querySelectorAll('.day').forEach(el=>el.classList.remove('active'));
  document.getElementById('vbpPanel').classList.remove('active');
  document.getElementById('shopPanel').classList.remove('active');
  document.getElementById('notesPanel').classList.add('active');
  document.querySelectorAll('.daynav button').forEach(el=>el.classList.remove('active'));
  document.querySelector('.daynav button.notes-btn').classList.add('active');
  window.scrollTo({top: document.querySelector('.daynav').offsetTop, behavior:'smooth'});
}

/* ============ 編輯模式 ============ */
let editing = false;
let unlocked = false;

function setEditable(on){
  document.querySelectorAll('.editable').forEach(el=>el.setAttribute('contenteditable', on ? 'true':'false'));
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function enterEditing(){
  editing = true;
  document.body.classList.add('editing');
  document.getElementById('editFab').classList.add('editing');
  const btn = document.getElementById('toggleEdit');
  btn.classList.add('on');
  btn.textContent = '✕ 結束編輯';
  setEditable(true);
}
function exitEditing(){
  editing = false;
  document.body.classList.remove('editing');
  document.getElementById('editFab').classList.remove('editing');
  const btn = document.getElementById('toggleEdit');
  btn.classList.remove('on');
  btn.textContent = '✏️ 編輯文字';
  setEditable(false);
  toast('已離開編輯模式');
}

document.getElementById('toggleEdit').addEventListener('click', ()=>{
  if(editing){ exitEditing(); return; }
  if(unlocked){ enterEditing(); return; }
  document.getElementById('lockOverlay').classList.remove('hidden');
  document.getElementById('lockInput').value = '';
  document.getElementById('lockErr').textContent = '';
  document.getElementById('lockInput').focus();
});

document.getElementById('lockSubmit').addEventListener('click', tryUnlock);
document.getElementById('lockInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') tryUnlock();
});
function tryUnlock(){
  const val = document.getElementById('lockInput').value;
  if(val === EDIT_PASSWORD){
    unlocked = true;
    document.getElementById('lockOverlay').classList.add('hidden');
    enterEditing();
  }else{
    document.getElementById('lockErr').textContent = '密碼錯誤，請再試一次';
  }
}

/* 結構編輯前，先把畫面上目前的文字同步進 DAYS/VBP，避免其他欄位的修改被蓋掉 */
function syncFromDom(){
  DAYS = scrapeDaysFromDom();
  VBP = scrapeVbpFromDom();
}
/* 重新渲染後，如果原本在編輯模式，要把 contenteditable 重新打開 */
function resumeEditingIfNeeded(){
  if(editing) setEditable(true);
}

function moveItem(dayIdx, itemIdx, dir){
  syncFromDom();
  const arr = DAYS[dayIdx].items;
  const j = itemIdx + dir;
  if(j < 0 || j >= arr.length) return;
  [arr[itemIdx], arr[j]] = [arr[j], arr[itemIdx]];
  render();
  resumeEditingIfNeeded();
  show(dayIdx);
  toast('已調整順序（記得按儲存）');
}

function deleteItem(dayIdx, itemIdx){
  syncFromDom();
  if(!confirm('確定要刪除這個行程項目嗎？')) return;
  DAYS[dayIdx].items.splice(itemIdx, 1);
  render();
  resumeEditingIfNeeded();
  show(dayIdx);
  toast('已刪除（記得按儲存）');
}

function addItem(dayIdx, afterIdx){
  syncFromDom();
  DAYS[dayIdx].items.splice(afterIdx + 1, 0, {t:'00:00', c:'', h:'新行程項目', p:'點這裡編輯內容...', tr:''});
  render();
  resumeEditingIfNeeded();
  show(dayIdx);
  toast('已新增一項，請編輯內容並儲存');
}

function changeCategory(dayIdx, itemIdx, val){
  syncFromDom();
  DAYS[dayIdx].items[itemIdx].c = val;
  render();
  resumeEditingIfNeeded();
  show(dayIdx);
  toast('已更新標籤（記得按儲存）');
}

function moveDay(dayIdx, dir){
  syncFromDom();
  const j = dayIdx + dir;
  if(j < 0 || j >= DAYS.length) return;
  [DAYS[dayIdx], DAYS[j]] = [DAYS[j], DAYS[dayIdx]];
  render();
  resumeEditingIfNeeded();
  show(j);
  toast('已調整天數順序（記得按儲存）');
}

/* ---- 購物清單：完全不需密碼，勾選／新增／刪除／改名稱都直接即時同步 ---- */
async function saveShoppingNow(){
  try{
    await set(ref(db, 'busan-shopping'), SHOPPING);
  }catch(e){
    console.error('儲存購物清單失敗:', e);
    toast('購物清單儲存失敗，請檢查網路');
  }
}

async function toggleShopItem(idx, checked){
  SHOPPING = scrapeShopFromDom();
  SHOPPING[idx].done = checked;
  const row = document.querySelectorAll('.shop-item')[idx];
  if(row) row.classList.toggle('done', checked);
  await saveShoppingNow();
}

async function addShopItem(){
  SHOPPING = scrapeShopFromDom();
  SHOPPING.push({name:'新項目', done:false});
  renderShopPanel();
  await saveShoppingNow();
  toast('已新增購物項目');
}

async function deleteShopItem(idx){
  SHOPPING = scrapeShopFromDom();
  if(!confirm('確定要刪除這個購物項目嗎？')) return;
  SHOPPING.splice(idx, 1);
  renderShopPanel();
  await saveShoppingNow();
  toast('已刪除');
}

// 讓 HTML 內的 onclick 可以呼叫到這些函式（module script 預設不會外露到全域）
window.moveItem = moveItem;
window.deleteItem = deleteItem;
window.addItem = addItem;
window.changeCategory = changeCategory;
window.moveDay = moveDay;
window.toggleShopItem = toggleShopItem;
window.addShopItem = addShopItem;
window.deleteShopItem = deleteShopItem;

// 交通方式欄位邊打字邊即時判斷是否為空（決定離開編輯模式後要不要隱藏這一行）
document.getElementById('days').addEventListener('input', (e)=>{
  if(e.target.classList && e.target.classList.contains('transport-text')){
    const row = e.target.closest('.transport-row');
    if(row) row.classList.toggle('is-empty', e.target.innerText.trim()==='');
  }
});

// 購物清單文字編輯完、游標移開時自動存檔（不需要按儲存按鈕）
document.getElementById('days').addEventListener('focusout', (e)=>{
  if(e.target.classList && e.target.classList.contains('shop-text')){
    SHOPPING = scrapeShopFromDom();
    saveShoppingNow();
  }
  if(e.target.id === 'notesBox'){
    NOTES = e.target.innerText;
    saveNotesNow();
  }
});

async function saveNotesNow(){
  try{
    await set(ref(db, 'busan-notes'), NOTES);
  }catch(e){
    console.error('儲存筆記失敗:', e);
    toast('筆記儲存失敗，請檢查網路');
  }
}

document.getElementById('saveEdit').addEventListener('click', async ()=>{
  DAYS = scrapeDaysFromDom();
  VBP = scrapeVbpFromDom();
  SHOPPING = scrapeShopFromDom();
  const notesBox = document.getElementById('notesBox');
  if(notesBox) NOTES = notesBox.innerText;
  try{
    await saveData();
    toast('已儲存變更 ✓ 對方重新整理即可看到');
  }catch(e){
    console.error('Storage error:', e);
    toast('儲存失敗：' + (e?.message || e));
  }
});

document.getElementById('resetEdit').addEventListener('click', async ()=>{
  if(!confirm('確定要還原成預設行程嗎？你手動修改過的文字、購物清單都會被清除（筆記本內容不受影響）。')) return;
  DAYS = normalizeDays(JSON.parse(JSON.stringify(DEFAULT_DAYS)));
  VBP = JSON.parse(JSON.stringify(VBP_DEFAULT));
  SHOPPING = JSON.parse(JSON.stringify(SHOPPING_DEFAULT));
  try{
    await saveData();
  }catch(e){ console.error(e); }
  render();
  setEditable(editing);
  toast('已還原為預設行程');
});

/* ============ 初始化 ============ */
(async function init(){
  await loadData();
  render();
})();
</script>
